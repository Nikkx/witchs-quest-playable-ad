:root{
  --side-top:#9db6d4; --side-bot:#e6eef7; --ink:#1d2a3a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --side-top:#0f1826; --side-bot:#263852; --ink:#dfe8f3; }
}
:root[data-theme="dark"]{ --side-top:#0f1826; --side-bot:#263852; --ink:#dfe8f3; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{
  height:100%; margin:0; overflow:hidden;
  background:linear-gradient(var(--side-top),var(--side-bot));
  color:var(--ink);
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#game{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
#game canvas{ display:block; border-radius:14px; box-shadow:0 12px 40px rgba(20,35,60,.35); }
#game canvas.full{ border-radius:0; box-shadow:none; }   /* phones: edge to edge */
#msg{ font:400 18px/1.4 "Chewy", "Trebuchet MS", system-ui, sans-serif; max-width:30ch; text-align:center; }

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const easeOut = t => 1 - Math.pow(1-t, 3);
function lerpColor(a,b,t){
  const r = Math.round(lerp(a>>16&255, b>>16&255, t));
  const g = Math.round(lerp(a>>8&255, b>>8&255, t));
  const bl = Math.round(lerp(a&255, b&255, t));
  return (r<<16)|(g<<8)|bl;
}
function txt(s, size, fill=0xfff8e6, stroke=0x141414, sw=10){   // cream fill + black outline, like the drawn digits
  const t = new PIXI.Text({ text:String(s).toUpperCase(), style:{   // all caps, to match her lettering
    fontFamily:FONT, fontSize:size, fill, letterSpacing:2,
    stroke:{ color:stroke, width:sw, join:'round' }, align:'center'
  }});
  t.anchor.set(0.5);
  return t;
}

const app = new PIXI.Application();
const input = { holding:false, id:null, x:0, keyL:false, keyR:false };
let G = null;

(async () => {
  try {
    await app.init({ width:W, height:H, background:C.sky1, antialias:true,
                     resolution:Math.min(window.devicePixelRatio || 1, 2), autoDensity:true });
  } catch (e) {
    document.getElementById('msg').textContent = 'The game engine failed to load. Check your connection and reload the page.';
    return;
  }
  const host = document.getElementById('game');
  // wait (briefly) for the web font so canvas text doesn't render in the fallback font
  try { if (document.fonts) await Promise.race([Promise.all([document.fonts.load('64px "Chewy"'), document.fonts.load("64px ScrollLogo", "WITCH'S QUEST")]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  try { TEX = await loadTextures(); }
  catch (e) { document.getElementById('msg').textContent = 'The background art failed to load. Reload the page.'; return; }
  host.innerHTML = '';
  host.appendChild(app.canvas);
  app.stage.eventMode = 'static';
  fit(); addEventListener('resize', fit);
  setupInput();
  try { startGame(); } catch (e) { showError(e); return; }
  app.ticker.add(t => { try { update(Math.min(t.deltaMS/1000, 0.05)); } catch (e) { app.ticker.stop(); showError(e); } });
})();

async function loadTextures(){
  const out = {};
  await Promise.all(Object.entries({ ...BG_SRC, ...CLOUD_SRC, ...YETI_SRC, ...MAGE_SRC, ...FX_SRC, ...DIGIT_SRC, ...LETTER_SRC }).map(async ([k, v]) => {
    const img = new Image(); img.src = v.src; await img.decode();
    out[k] = { tex:PIXI.Texture.from(img), y:v.y, box:v.box };
  }));
  return out;
}

// If something breaks, say so on screen instead of leaving a blank canvas
function showError(e){
  console.error(e);
  const host = document.getElementById('game');
  host.innerHTML = '<p id="msg"></p>';
  host.firstChild.textContent = 'The game hit an error: ' + (e && e.message ? e.message : e);
}

// Visible part of the 1080x1920 design stage, in stage units. On phones the stage fills the screen
// edge to edge: width fits exactly and the bottom is anchored, so taller phones reveal more sky
// (VIS.y0 < 0) and slightly wider ones crop a little sky (VIS.y0 > 0). Wide screens get a letterbox.
const VIS = { y0:0 };
function fit(){
  const r = document.getElementById('game').getBoundingClientRect();
  const vw = Math.max(1, r.width), vh = Math.max(1, r.height);
  let s, cw, ch, oy;
  if (vw/vh <= 0.62){ s = vw/W; cw = vw; ch = vh; oy = vh - H*s; app.canvas.classList.add('full'); }
  else { s = Math.min(vw/W, vh/H); cw = W*s; ch = H*s; oy = 0; app.canvas.classList.remove('full'); }
  app.renderer.resize(cw, ch);
  app.canvas.style.width = cw + 'px'; app.canvas.style.height = ch + 'px';
  app.stage.scale.set(s); app.stage.position.set(0, oy);
  VIS.y0 = -oy/s;
  app.stage.hitArea = new PIXI.Rectangle(0, VIS.y0, W, H - VIS.y0);
  if (G) pinTop();
}
// UI that hugs the top edge of the screen
function pinTop(){
  G.hud.y = VIS.y0;
  if (G.muteBtn) G.muteBtn.y = VIS.y0 + 62;
}


/* =========================================================
   AUDIO — procedural music + sound effects (Web Audio API).
   No audio files: everything is synthesized, so it costs a few KB.
   Music: one A-minor loop at 116 BPM
     level 0 (intro, first seconds, end card)  soft pad + bell melody
     level 1 (fight, from 5s)    epic: string ostinato, bass, taiko drums, brass stabs
     level 2 (from 11s)          + heroic lead melody, cracking snare, more brass
     level 3 (meteor ready)      tense chords, melody up an octave, rolling drums, choir
   Bass and drums are built with plenty of overtones so they're audible on phone speakers,
   which can't reproduce deep low notes on their own.
   Meteor: the music keeps going but goes muffled (slow-motion feel) under a rocket-like roar;
   impact: a cinematic hit (snap, punch, saturated boom, low brass "braam", sub, hall reverb; no pitch dives); cliffhanger: tense string tremolo + heartbeat drums;
   end card: back to the calm loop.
   Mobile browsers only allow sound after the first tap, so it starts then.
   ========================================================= */
const SND = { ctx:null, muted:false, mode:'music', level:0, nextBeat:0, beat:0 };
const BEAT = 60/116;
const midi = n => 440*Math.pow(2, (n - 69)/12);
const CH = (root, tones) => ({ root, tones });
const PROG_A = [CH(45,[57,60,64]), CH(41,[53,57,60]), CH(48,[55,60,64]), CH(43,[55,59,62])];   // Am F C G
const PROG_B = [CH(45,[57,60,64]), CH(41,[53,57,60]), CH(43,[55,59,62]), CH(40,[52,56,59])];   // Am F G E
const _ = null;
const MEL_A = [[76,_,72,_,69,_,72,_], [77,_,72,_,69,_,72,74], [76,_,79,_,76,_,72,_], [74,_,71,_,67,_,74,_]];
const HERO  = [[69,_,_,72,76,_,74,72], [69,_,_,65,69,_,72,_], [67,_,_,76,74,_,72,_], [71,_,_,74,67,_,_,_]];       // over Am F C G
const HERO3 = [[81,_,_,84,88,_,86,84], [81,_,_,77,81,_,84,_], [79,_,_,83,86,_,83,79], [80,_,_,83,88,_,83,80]];    // over Am F G E, an octave up

function audioUnlock(){
  if (SND.ctx){ if (SND.ctx.state === 'suspended' && !document.hidden) SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = SND.ctx = new AC();
  const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  comp.connect(c.destination);
  SND.master = c.createGain(); SND.master.gain.value = SND.muted ? 0 : 0.9; SND.master.connect(comp);
  SND.musicFilter = c.createBiquadFilter(); SND.musicFilter.type = 'lowpass'; SND.musicFilter.frequency.value = 18000;
  SND.musicFilter.connect(SND.master);
  SND.music = c.createGain(); SND.music.gain.value = 0.55; SND.music.connect(SND.musicFilter);
  SND.sfx = c.createGain(); SND.sfx.gain.value = 0.8; SND.sfx.connect(SND.master);
  const len = c.sampleRate, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
  SND.noise = buf;
  musicReset();
}
function audioOn(){ return SND.ctx && SND.ctx.state === 'running'; }

// one synth note: osc -> (filter) -> gain envelope -> destination
function tone(type, freq, t, dur, vol, dest, o = {}){
  const c = SND.ctx, osc = c.createOscillator(), g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + (o.slideT || dur));
  if (o.detune) osc.detune.value = o.detune;
  const a = o.a ?? 0.005;
  if (o.pad){            // swell in, hold, fade out
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.setValueAtTime(vol, t + Math.max(a, dur - 0.3)); g.gain.linearRampToValueAtTime(0.0001, t + dur);
  } else {               // pluck: quick attack, exponential decay
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
  }
  let node = osc;
  if (o.filter){
    const f = c.createBiquadFilter(); f.type = o.filter; f.frequency.setValueAtTime(o.fq || 1000, t);
    if (o.fq2) f.frequency.exponentialRampToValueAtTime(o.fq2, t + (o.fT || dur));     // filter sweep (brass swell)
    osc.connect(f); node = f;
  }
  node.connect(g); g.connect(dest || SND.sfx);
  osc.start(t); osc.stop(t + dur + 0.05);
}
// filtered noise burst (whooshes, thuds, hats, snares)
function noiseHit(t, dur, vol, type, freq, o = {}){
  const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = SND.noise; f.type = type; f.frequency.setValueAtTime(freq, t);
  if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
  if (o.Q) f.Q.value = o.Q;
  const a = o.a ?? 0.003;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(dur, a + 0.01));
  src.connect(f); f.connect(g); g.connect(o.dest || SND.sfx);
  src.start(t, Math.random()*0.5); src.stop(t + dur + 0.05);
}
// oscillator -> saturation -> sweeping lowpass -> envelope (saturation adds overtones small speakers can play)
function driven(type, f0, f1, t, dur, vol, drive, lp0, lp1, dest, o = {}){
  const c = SND.ctx, osc = c.createOscillator(), sh = c.createWaveShaper(), f = c.createBiquadFilter(), g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + (o.slideT || dur));
  if (o.detune) osc.detune.value = o.detune;
  const cv = new Float32Array(512); for (let i = 0; i < 512; i++) cv[i] = Math.tanh((i/256 - 1)*drive); sh.curve = cv;
  f.type = 'lowpass'; f.frequency.setValueAtTime(lp0, t); f.frequency.exponentialRampToValueAtTime(lp1, t + dur);
  const a = o.a ?? 0.004;
  g.gain.setValueAtTime(0.0001, t);
  if (o.lin) g.gain.linearRampToValueAtTime(vol, t + a); else g.gain.exponentialRampToValueAtTime(vol, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(sh); sh.connect(f); f.connect(g); g.connect(dest); osc.start(t); osc.stop(t + dur + 0.05);
}
// brown noise (deeper, rumbly "roar" noise), built once
function brownNoise(){
  if (SND.brown) return SND.brown;
  const c = SND.ctx, len = c.sampleRate*2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){ last = (last + 0.02*(Math.random()*2 - 1))/1.02; d[i] = last*3.5; }
  return SND.brown = buf;
}
// big-hall reverb from a generated impulse (decaying noise), built once
function reverbBus(){
  if (SND.rev) return SND.rev;
  const c = SND.ctx, len = Math.floor(c.sampleRate*2.8), ir = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/len, 3.5); }
  const cv = c.createConvolver(), g = c.createGain(); cv.buffer = ir; g.gain.value = 0.5;
  cv.connect(g); g.connect(SND.master);
  return SND.rev = cv;
}
const hat   = (t, v) => noiseHit(t, 0.035, v, 'highpass', 7500, { dest:SND.music });
// taiko-style drum: deep pitch drop + a mid "skin" tone + a thump, so it reads on small speakers too
const taiko = (t, v) => { const M = SND.music;
  tone('sine', 160, t, 0.45, v, M, { slide:55, slideT:0.25 });
  tone('triangle', 230, t, 0.14, v*0.45, M, { slide:110 });
  noiseHit(t, 0.12, v*0.5, 'lowpass', 1500, { dest:M }); };
const crack = (t, v) => { noiseHit(t, 0.28, v, 'bandpass', 1400, { dest:SND.music, Q:0.6, sweep:900 });
  tone('triangle', 240, t, 0.1, v*0.4, SND.music, { slide:160 }); };
const crash = (t, v) => noiseHit(t, 1.4, v, 'highpass', 5000, { dest:SND.music });

function musicReset(){
  if (!SND.ctx) return;
  const now = SND.ctx.currentTime, f = SND.musicFilter.frequency, g = SND.music.gain;
  f.cancelScheduledValues(now); g.cancelScheduledValues(now);
  f.setValueAtTime(18000, now); g.setValueAtTime(0.55, now);
  SND.mode = 'music'; SND.level = 0; SND.prevLevel = 0; SND.beat = 0; SND.nextBeat = now + 0.1;
}

function wantedMusic(){
  if (!G) return { mode:'music', level:0 };
  switch (G.phase){
    case 'intro':  return { mode:'music', level:0 };
    case 'ready':  return { mode:'music', level:3 };
    case 'meteor': return { mode: G.impacted ? 'tension' : 'slowmo' };
    case 'cliff':  return { mode:'tension' };
    case 'end':    return { mode:'end', level:0 };
  }
  return { mode:'music', level: G.t < 5 ? 0 : G.t < 11 ? 1 : 2 };
}

// note lengths: a melody note lasts until the next note in its bar
function noteDur(row, i){ let j = i + 1; while (j < 8 && row[j] == null) j++; return (j - i)*BEAT/2; }

function playBeat(t, bar, k, L){
  const M = SND.music;
  if (L === 0){                                          // calm theme: intro and end card
    const ch = PROG_A[bar];
    if (k === 0) ch.tones.forEach((n, i) => tone('triangle', midi(n), t, BEAT*4, 0.04, M, { pad:true, a:0.25, filter:'lowpass', fq:1200, detune:i*4 }));
    for (let h = 0; h < 2; h++){ const n = MEL_A[bar][k*2 + h]; if (n) tone('triangle', midi(n), t + h*BEAT/2, 0.6, 0.07, M); }
    return;
  }
  // ---- epic fight music ----
  const ch = (L >= 3 ? PROG_B : PROG_A)[bar], r = ch.root;
  if (k === 0){
    if (L > SND.prevLevel) crash(t, 0.16);              // cymbal swell whenever the music steps up
    ch.tones.forEach((n, i) => {                         // strings pad: two detuned saws per note
      for (const dt of [-7, 7]) tone('sawtooth', midi(n), t, BEAT*4, 0.014, M, { pad:true, a:0.5, filter:'lowpass', fq:1500, detune:dt });
      if (L >= 3) tone('triangle', midi(n + 12), t, BEAT*4, 0.03, M, { pad:true, a:0.6 });          // "choir"
    });
  }
  if (k === 0 || (L >= 2 && k === 2))                    // brass stabs: saw chord with a swelling filter
    ch.tones.forEach((n, i) => tone('sawtooth', midi(n), t, BEAT*1.6, 0.028, M,
      { pad:true, a:0.06, filter:'lowpass', fq:500, fq2:2800, fT:0.25, detune:(i - 1)*6 }));
  const OST = [0, 0, 7, 0, 12, 0, 7, 0];
  for (let h = 0; h < 2; h++){
    const tt = t + h*BEAT/2, idx = k*2 + h;
    tone('sawtooth', midi(r + 12 + OST[idx]), tt, BEAT/2*0.8, 0.034, M, { filter:'lowpass', fq:1800 });   // string ostinato
    tone('sawtooth', midi(r), tt, BEAT/2*0.85, 0.1, M, { filter:'lowpass', fq:900 });                     // bass
    tone('square', midi(r + 12), tt, BEAT/2*0.85, 0.035, M, { filter:'lowpass', fq:1400 });               // bass overtone (phones)
    if (L >= 2){                                                                                          // heroic lead
      const row = (L >= 3 ? HERO3 : HERO)[bar], n = row[idx];
      if (n) for (const [ty, dt] of [['sawtooth', -5], ['square', 5]])
        tone(ty, midi(n), tt, noteDur(row, idx)*0.95, 0.03, M, { pad:true, a:0.02, filter:'lowpass', fq:3000, detune:dt });
    }
    if (L >= 2) hat(tt, h ? 0.03 : 0.05);
  }
  // drums: boom . (ba) . boom . ba .  — rolls on the last beat when the meteor is ready
  if (k === 0 || k === 2) taiko(t, 0.55);
  if (k === 1) taiko(t + BEAT/2, 0.3);
  if (k === 3){ taiko(t + BEAT/2, 0.35); if (L >= 3) for (let q = 0; q < 4; q++) taiko(t + q*BEAT/4, 0.22 + q*0.06); }
  if (L >= 2 && (k === 1 || k === 3)) crack(t, 0.2);
  if (k === 3) SND.prevLevel = L;
}
// cliffhanger: tense string tremolo (fast repeated notes) on Am / E, with a heartbeat drum
function playTension(t, k){
  const M = SND.music, e = Math.floor(SND.beat/4) % 2 === 1;
  const chord = e ? [56, 59, 64] : [57, 60, 64], root = e ? 40 : 45;
  for (let q = 0; q < 4; q++)
    chord.forEach((n, i) => tone('sawtooth', midi(n), t + q*BEAT/4, BEAT/4*0.9, 0.022, M, { filter:'lowpass', fq:1600, detune:(i - 1)*5 }));
  tone('sawtooth', midi(root), t, BEAT*0.95, 0.09, M, { pad:true, a:0.02, filter:'lowpass', fq:900 });
  tone('square', midi(root + 12), t, BEAT*0.95, 0.03, M, { pad:true, a:0.02, filter:'lowpass', fq:1400 });
  if (k === 0 || k === 2) taiko(t, 0.5);
}

// called every frame: switches modes, and schedules beats a little ahead of time
function musicUpdate(){
  if (!audioOn()) return;
  const c = SND.ctx, now = c.currentTime, want = wantedMusic();
  if (want.mode !== SND.mode){
    const f = SND.musicFilter.frequency, g = SND.music.gain;
    f.cancelScheduledValues(now); g.cancelScheduledValues(now);
    f.setValueAtTime(Math.max(f.value, 100), now); g.setValueAtTime(Math.max(g.value, 0.0001), now);
    if (want.mode === 'slowmo'){                      // muffle, don't stop: no silence while the meteor falls
      f.exponentialRampToValueAtTime(650, now + 0.4); g.exponentialRampToValueAtTime(0.32, now + 0.4);
    } else {
      f.exponentialRampToValueAtTime(18000, now + 0.2); g.exponentialRampToValueAtTime(0.55, now + 0.2);
      SND.beat = 0; SND.nextBeat = now + (want.mode === 'tension' ? 0.6 : 0.05);    // let the impact ring first
    }
    SND.mode = want.mode;
  }
  if (SND.nextBeat < now - 0.5) SND.nextBeat = now + 0.05;      // came back from a paused tab
  while (SND.nextBeat < now + 0.25){
    const t = SND.nextBeat, k = SND.beat % 4, bar = Math.floor(SND.beat/4) % 4;
    if (k === 0 && want.level != null) SND.level = want.level;    // new layers come in on the bar
    if (SND.mode === 'music' || SND.mode === 'end' || SND.mode === 'slowmo') playBeat(t, bar, k, SND.level);
    else if (SND.mode === 'tension') playTension(t, k);
    SND.nextBeat += BEAT; SND.beat++;
  }
}

// sound effects
function sfx(name, arg){
  if (!audioOn()) return;
  const t = SND.ctx.currentTime;
  switch (name){
    case 'cast':  noiseHit(t, 0.12, 0.045, 'bandpass', rand(1800, 2400), { sweep:700, Q:1.5 }); break;
    case 'hit':   noiseHit(t, 0.09, 0.08, 'lowpass', 900); tone('sine', rand(160, 190), t, 0.1, 0.07, null, { slide:80 });
                  if (arg){ tone('triangle', midi(88), t, 0.25, 0.05); tone('triangle', midi(93), t + 0.06, 0.3, 0.05); } break;
    case 'throw': noiseHit(t, 0.25, 0.07, 'bandpass', 500, { sweep:1400, Q:1 }); break;
    case 'snowLand': noiseHit(t, 0.18, 0.12, 'lowpass', 500); tone('sine', 110, t, 0.15, 0.1, null, { slide:50 }); break;
    case 'iceLand': tone('sine', rand(1900, 2300), t, 0.25, 0.05); tone('sine', rand(2900, 3300), t, 0.18, 0.035);
                    noiseHit(t, 0.1, 0.05, 'highpass', 3000); break;
    case 'dodge': tone('triangle', midi(84), t, 0.15, 0.06); tone('triangle', midi(91), t + 0.07, 0.25, 0.06); break;
    case 'ouch':  tone('square', midi(64), t, 0.14, 0.06, null, { slide:midi(52), filter:'lowpass', fq:1800 }); break;
    case 'land':  tone('sine', 100, t, 0.7, 0.5, null, { slide:30, slideT:0.3 }); noiseHit(t, 0.6, 0.25, 'lowpass', 900, { sweep:120 }); break;
    case 'ready': [81, 84, 88, 93].forEach((n, i) => tone('triangle', midi(n), t + i*0.07, 0.4, 0.06));
                  reverbBus(); brownNoise(); break;   // build these now, so the meteor itself never hitches
    case 'riser': {                                   // meteor approach, rocket-style: one dense, steady roar that builds (arg = seconds to impact)
      const c = SND.ctx, d = arg, bus = c.createGain(), send = c.createGain();
      bus.gain.value = 0.7;                           // overall level of the approach roar (~3 dB quieter than before)
      send.gain.value = 0.3; bus.connect(SND.sfx); bus.connect(send); send.connect(reverbBus());
      const brown = brownNoise();
      const sat = new Float32Array(512); for (let i = 0; i < 512; i++) sat[i] = Math.tanh((i/256 - 1)*2.5);
      // main roar: deep brown noise, saturated for grit, filter opening as it builds. No pitch, no wobble.
      const n1 = c.createBufferSource(), s1 = c.createWaveShaper(), f1 = c.createBiquadFilter(), g1 = c.createGain();
      n1.buffer = brown; n1.loop = true; s1.curve = sat; f1.type = 'lowpass'; f1.Q.value = 0.5;
      f1.frequency.setValueAtTime(700, t); f1.frequency.exponentialRampToValueAtTime(4500, t + d);
      g1.gain.setValueAtTime(0.18, t); g1.gain.linearRampToValueAtTime(0.6, t + d); g1.gain.linearRampToValueAtTime(0.0001, t + d + 0.04);
      n1.connect(s1); s1.connect(f1); f1.connect(g1); g1.connect(bus); n1.start(t, Math.random()); n1.stop(t + d + 0.1);
      // low rumble underneath (noise, not a tone, so it never sounds like an engine)
      const n2 = c.createBufferSource(), s2 = c.createWaveShaper(), f2 = c.createBiquadFilter(), g2 = c.createGain();
      n2.buffer = brown; n2.loop = true; s2.curve = sat; f2.type = 'lowpass'; f2.frequency.value = 220;
      g2.gain.setValueAtTime(0.25, t); g2.gain.linearRampToValueAtTime(0.5, t + d); g2.gain.linearRampToValueAtTime(0.0001, t + d + 0.04);
      n2.connect(s2); s2.connect(f2); f2.connect(g2); g2.connect(bus); n2.start(t, Math.random()); n2.stop(t + d + 0.1);
      // short airy swell over the last half second, leading into the hit
      const n3 = c.createBufferSource(), f3 = c.createBiquadFilter(), g3 = c.createGain();
      n3.buffer = SND.noise; n3.loop = true; f3.type = 'highpass'; f3.frequency.value = 3000;
      g3.gain.setValueAtTime(0.0001, t); g3.gain.setValueAtTime(0.002, t + d*0.5); g3.gain.exponentialRampToValueAtTime(0.14, t + d);
      g3.gain.linearRampToValueAtTime(0.0001, t + d + 0.03);
      n3.connect(f3); f3.connect(g3); g3.connect(bus); n3.start(t); n3.stop(t + d + 0.1);
      break;
    }
    case 'impact': {                                  // cinematic trailer-style hit
      const c = SND.ctx, hit = c.createGain(), send = c.createGain();
      send.gain.value = 0.55; hit.connect(SND.sfx); hit.connect(send); send.connect(reverbBus());
      noiseHit(t, 0.025, 0.8, 'lowpass', 9000, { dest:hit, a:0.001 });                       // transient snap
      driven('sine', 70, 70, t, 0.5, 0.8, 7, 2500, 400, hit);                                  // punch (steady pitch)
      noiseHit(t, 0.14, 0.55, 'lowpass', 500, { dest:hit, a:0.002 });                          // body thud
      driven('sine', 52, 52, t, 2.4, 0.5, 4, 1000, 200, hit);                                  // boom body (saturated = audible on phones)
      [[33, -10], [33, 10], [40, -8], [45, 8], [57, -6]].forEach(([n, dt]) =>                 // "braam": low detuned brass cluster
        driven('sawtooth', midi(n), midi(n), t, 2.6, 0.07, 2.5, 2400, 220, hit, { a:0.015, detune:dt }));
      tone('sine', 40, t, 1.8, 0.35, hit);                                                     // sub (headphones)
      noiseHit(t, 1.6, 0.18, 'lowpass', 1400, { dest:hit, sweep:200 });                       // low rumble
      noiseHit(t, 2.2, 0.08, 'highpass', 6000, { dest:send });                                // air shimmer, reverb only
      break;
    }
    case 'roar':  roarSound(t); break;
    case 'tada':  [69, 72, 76, 81].forEach((n, i) => tone('triangle', midi(n), t + i*0.09, 1.0, 0.06)); break;
    case 'click': tone('triangle', midi(84), t, 0.08, 0.06); break;
  }
}
// roar: mostly breath noise plus a raspy voice, distorted, then shaped by moving vocal formants
// (an open "RAAAWR" vowel) so it reads as a big animal rather than a low buzz
function roarSound(t){
  const c = SND.ctx, d = 1.7, out = c.createGain();
  out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.6, t + 0.18);
  out.gain.setValueAtTime(0.6, t + d - 0.6); out.gain.exponentialRampToValueAtTime(0.0001, t + d);
  const src = c.createGain();
  const nz = c.createBufferSource(); nz.buffer = SND.noise; nz.loop = true;
  const nzg = c.createGain(); nzg.gain.value = 0.9; nz.connect(nzg); nzg.connect(src);
  const vg = c.createGain(); vg.gain.value = 0.45; vg.connect(src);
  const voices = [['sawtooth', 1], ['square', 1.012]].map(([ty, m]) => {
    const o = c.createOscillator(); o.type = ty;
    o.frequency.setValueAtTime(130*m, t); o.frequency.linearRampToValueAtTime(190*m, t + 0.3);
    o.frequency.linearRampToValueAtTime(150*m, t + 1.0); o.frequency.linearRampToValueAtTime(95*m, t + d);
    o.connect(vg); return o;
  });
  const rasp = c.createGain(); rasp.gain.value = 0.6; src.connect(rasp);          // fast tremble = growl texture
  const lfos = [[41, 0.35], [53, 0.2]].map(([fr, depth]) => {
    const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = fr; lg.gain.value = depth;
    l.connect(lg); lg.connect(rasp.gain); return l;
  });
  const sh = c.createWaveShaper(); const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) curve[i] = Math.tanh((i/128 - 1)*3); sh.curve = curve;
  rasp.connect(sh);
  [[500, 800, 550, 6, 1.0], [1000, 1300, 900, 7, 0.7], [2500, 2700, 2300, 8, 0.35]].forEach(([f0, f1, f2, Q, gv]) => {
    const f = c.createBiquadFilter(), g = c.createGain(); f.type = 'bandpass'; f.Q.value = Q;
    f.frequency.setValueAtTime(f0, t); f.frequency.linearRampToValueAtTime(f1, t + 0.35); f.frequency.linearRampToValueAtTime(f2, t + d);
    g.gain.value = gv*3; sh.connect(f); f.connect(g); g.connect(out);
  });
  const body = c.createBiquadFilter(), bg = c.createGain(); body.type = 'lowpass'; body.frequency.value = 350; bg.gain.value = 0.3;
  sh.connect(body); body.connect(bg); bg.connect(out);
  out.connect(SND.sfx);
  [nz, ...voices, ...lfos].forEach(o => { o.start(t); o.stop(t + d + 0.05); });
}

function setMuted(m){
  SND.muted = m;
  if (SND.ctx) SND.master.gain.setTargetAtTime(m ? 0 : 0.9, SND.ctx.currentTime, 0.02);
  if (G && G.muteBtn) drawMuteIcon();
}
// first tap/key anywhere unlocks audio (browser rule); pause sound when the tab is hidden
addEventListener('pointerdown', audioUnlock, true);
addEventListener('keydown', audioUnlock, true);
if (document.addEventListener) document.addEventListener('visibilitychange', () => {
  if (SND.ctx) document.hidden ? SND.ctx.suspend() : SND.ctx.resume();
});

// speaker button, top-right
function buildMuteButton(){
  const b = new PIXI.Container(); b.position.set(1022, 62);
  b.addChild(new PIXI.Graphics().circle(0, 0, 38).fill({ color:0x141414, alpha:0.55 }));
  G.muteIcon = new PIXI.Container(); b.addChild(G.muteIcon);
  b.eventMode = 'static'; b.cursor = 'pointer'; b.hitArea = new PIXI.Circle(0, 0, 52);
  b.on('pointerdown', e => { e.stopPropagation(); setMuted(!SND.muted); });
  G.muteBtn = b; G.ui.addChild(b);
  drawMuteIcon();
}
function drawMuteIcon(){
  const ic = G.muteIcon;
  ic.removeChildren().forEach(c => c.destroy());
  const body = [-16,-7, -6,-7, 6,-18, 6,18, -6,7, -16,7];
  const lines = (w, col) => {
    const g = new PIXI.Graphics();
    if (SND.muted) g.moveTo(14, -9).lineTo(28, 9).moveTo(28, -9).lineTo(14, 9);
    else g.moveTo(6 + Math.cos(-0.8)*12, Math.sin(-0.8)*12).arc(6, 0, 12, -0.8, 0.8)
          .moveTo(6 + Math.cos(-0.8)*21, Math.sin(-0.8)*21).arc(6, 0, 21, -0.8, 0.8);
    return g.stroke({ width:w, color:col, cap:'round' });
  };
  ic.addChild(new PIXI.Graphics().poly(body).fill(0x141414).stroke({ width:8, color:0x141414, join:'round' }),
              lines(10, 0x141414), new PIXI.Graphics().poly(body).fill(0xfff8e6), lines(4.5, 0xfff8e6));
}

/* ---------------- input ---------------- */
function canMove(){ return G && (G.phase === 'fight' || G.phase === 'ready'); }
function setupInput(){
  const s = app.stage;
  s.on('pointerdown', e => {
    if (!canMove()) return;
    input.holding = true; input.id = e.pointerId; input.x = app.stage.toLocal(e.global).x;
  });
  s.on('globalpointermove', e => { if (input.holding && e.pointerId === input.id) input.x = app.stage.toLocal(e.global).x; });
  const up = e => { if (e.pointerId === input.id) input.holding = false; };
  s.on('pointerup', up); s.on('pointerupoutside', up);
  addEventListener('blur', () => { input.holding = false; input.keyL = input.keyR = false; });
  addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.keyL = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.keyR = true;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); tryMeteor(); }
    if (e.code === 'KeyR') setTimeout(startGame, 0);
  });
  addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.keyL = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') input.keyR = false;
  });
}

function buildYeti(){
  // Container origin = bottom-centre of the yeti (its feet), so squash, hops and stagger pivot naturally
  const R = YETI_RIG, ox = R.w/2, oy = R.h;
  const c = new PIXI.Container();
  c.x = 540; c.y = -600;
  const sp = (k, x, y) => { const s = new PIXI.Sprite(TEX[k].tex); s.position.set(x, y); return s; };
  const arm = (k, sh) => {
    const s = sp(k, 0, 0);
    s.pivot.set(sh[0], sh[1]);
    s.position.set(R.pos[k][0] + sh[0] - ox, R.pos[k][1] + sh[1] - oy);
    return s;
  };
  const armL = arm('armL', R.shoulderL), armR = arm('armR', R.shoulderR);
  const bodyC = new PIXI.Container();               // body + face squash together, pivot at feet
  bodyC.addChild(sp('body', R.pos.body[0] - ox, R.pos.body[1] - oy));
  const faces = {};
  for (const k of ['faceIdle','faceGrit','faceRoar']){
    const f = sp(k, 0, 0);
    f.anchor.set(0.5);
    f.position.set(R.pos[k][0] + f.texture.width/2 - ox, R.pos[k][1] + f.texture.height/2 - oy);
    f.visible = k === 'faceIdle';
    bodyC.addChild(f); faces[k] = f;
  }
  c.addChild(armL, armR, bodyC);                     // arms behind the body, as drawn
  G.L.yeti.addChild(c);
  G.yeti = { c, bodyC, armL, armR, faces, face:'faceIdle', armLBase:armL.y, armRBase:armR.y,
             flashV:0, recoil:0, throwT:-1, hopT:-1, extraY:0, roar:0, baseY:935 };   // feet on the cloud's front edge, drawn in front of it
}

function makeCracks(){
  const segs = [];
  const grow = (x, y, ang, depth, len) => {
    for (let d = depth; d < depth + len; d++){
      const L = rand(40, 85);
      const nx = x + Math.cos(ang)*L, ny = y + Math.sin(ang)*L;
      segs.push({ x1:x, y1:y, x2:nx, y2:ny, d });
      x = nx; y = ny; ang += rand(-0.5, 0.5);
      if (Math.random() < 0.18 && len > 4) grow(x, y, ang + rand(-0.9, 0.9), d + 1, Math.floor(len*0.45));
    }
  };
  for (let i = 0; i < 12; i++){
    const side = i % 4; let x, y;
    const top = VIS.y0, cy = (top + H)/2;          // cracks start at the edges of what's actually on screen
    if (side === 0){ x = rand(0, W); y = top; }
    else if (side === 1){ x = W; y = rand(top, H); }
    else if (side === 2){ x = rand(0, W); y = H; }
    else { x = 0; y = rand(top, H); }
    grow(x, y, Math.atan2(cy - y, W/2 - x) + rand(-0.4, 0.4), 0, Math.floor(rand(6, 11)));
  }
  return segs;
}

/* ---------------- fx helpers ---------------- */
function particle(x, y, o){
  const life = o.life || 0.6;
  const g = new PIXI.Graphics().circle(0, 0, o.r || 8).fill({ color:o.color ?? 0xffffff, alpha:o.alpha ?? 1 });
  g.position.set(x, y);
  G.L.fx.addChild(g);
  G.particles.push({ g, vx:o.vx || 0, vy:o.vy || 0, grav:o.grav || 0, life, max:life, shrink:o.shrink ?? true });
}
function burst(x, y, n, o){
  for (let i = 0; i < n; i++){
    const a = rand(0, Math.PI*2), sp = rand(o.min || 100, o.max || 400);
    particle(x, y, { ...o, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp + (o.up || 0), r:rand(o.rMin || 5, o.rMax || 12) });
  }
}
function digitPop(n, x, y, o = {}){
  const kind = o.gold ? 'gold' : 'cream', c = new PIXI.Container(), str = String(n);
  let px = 0;
  const sprites = [...str].map(d => {
    const sp = new PIXI.Sprite(TEX[`dg_${kind}_${d}`].tex);
    sp.anchor.set(0.5);
    const w = sp.texture.width - 2*DIGIT_DY.pad;            // drawn width, without the outline margin
    sp.x = px + w/2; sp.y = DIGIT_DY[kind][d] + rand(-3, 3);
    sp.rotation = rand(-0.07, 0.07);                      // slight wobble so it feels hand-placed
    px += w*0.9;                                            // digits overlap a touch, like lettering
    c.addChild(sp); return sp;
  });
  sprites.forEach(sp => sp.x -= px/2);                     // centre the number on x
  c.position.set(x, y);
  G.L.fx.addChild(c);
  const life = o.life || 0.9;
  G.pops.push({ t:c, vy:o.vy ?? -260, life, max:life, base:o.scale || 1 });
}

function pop(s, x, y, o = {}){
  const t = txt(s, o.size || 64, o.fill ?? 0xfff8e6, o.stroke ?? 0x141414, o.sw || 10);
  t.position.set(x, y);
  G.L.fx.addChild(t);
  const life = o.life || 0.9;
  G.pops.push({ t, vy:o.vy ?? -260, life, max:life, base:o.scale || 1 });
}

/* ---------------- gameplay ---------------- */
const hpTarget = t => t < T.introEnd ? 1 : lerp(1, T.hpBeforeMeteor, clamp((t - T.introEnd)/(T.meteorFullBy - T.introEnd), 0, 1));
const chargeFloor = t => clamp((t - T.introEnd)/(T.meteorFullBy - T.introEnd), 0, 1)*100;

function fire(){
  const m = G.mage;
  setMageFrame(m.walking ? 'mage_walking' : 'mage_casting');
  const st = mageStar(), sx = st.x, sy = st.y;
  const tx = G.yeti.c.x + rand(-150, 150), ty = G.yeti.c.y - rand(200, 470);
  const a = Math.atan2(ty - sy, tx - sx), sp = 1700;
  const g = new PIXI.Sprite(TEX.fx_fire1.tex);
  g.anchor.set(0.5, 0.72);                       // centre of the round base
  g.rotation = a - Math.PI/2;                    // art points up; turn so the base leads and the flame trails
  g.position.set(sx, sy);
  G.L.shots.addChild(g);
  G.fireballs.push({ g, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, tx, ty, ft:Math.random()*0.16 });
  m.castT = 0.16;
  sfx('cast');
}

function fireballHit(x, y){
  let dmg = Math.round(rand(900, 1600));
  const crit = Math.random() < 0.15;
  if (crit) dmg *= 2;
  sfx('hit', crit);
  digitPop(dmg, x + rand(-30, 30), y - 40, crit ? { gold:true, scale:0.75 } : { scale:1 });
  burst(x, y, 6, { color:C.fire, min:150, max:420, life:0.35 });
  burst(x, y, 5, { color:0xe9eef4, min:40, max:120, up:-160, life:0.8, rMin:10, rMax:20, alpha:0.8 });
  G.yeti.flashV = 1; G.yeti.recoil = 1;
  const tgt = hpTarget(G.t);
  G.hp = Math.max(tgt, G.hp - (G.hp - tgt)*0.35 - 0.004);
}

function launchAttack(a){
  const mx = G.mage.c.x;
  const tele = a.tutorial ? 2.0 : 0.95;
  const xs = a.type === 'ice'
    ? [mx, mx + rand(230, 300), mx - rand(230, 300)].map(x => clamp(x, 80, W - 80))
    : [clamp(mx, 80, W - 80)];
  xs.forEach((x, i) => {
    const sh = new PIXI.Graphics().ellipse(0, 0, 90, 24).fill({ color:C.ink, alpha:0.35 });
    sh.position.set(x, GROUND_Y - 8); sh.scale.set(0.2);
    G.L.shadow.addChild(sh);
    G.shots.push({ type:a.type, x, tele:tele + i*0.12, t:0, sh, proj:null, fall:a.type === 'ice' ? 0.55 : 0.7, tutorial:!!a.tutorial });
  });
  if (a.tutorial) showMoveHint();
}

function showMoveHint(){
  G.tutorialActive = true; G.tutMoved = 0;
  G.hintTxt.visible = true;
}
function hideMoveHint(){
  G.tutorialActive = false;
  G.hintTxt.visible = false;
}

function landShot(s){
  const dx = Math.abs(G.mage.c.x - s.x);
  burst(s.x, GROUND_Y - 30, 12, { color:s.type === 'ice' ? C.ice : 0xffffff, min:120, max:380, up:-200, grav:900, life:0.6 });
  sfx(s.type === 'ice' ? 'iceLand' : 'snowLand');
  if (dx < T.hitRadius) hitMage(s.x);
  else if (dx < T.dodgeRadius && G.dodgeCD <= 0){
    pop('Dodged!', G.mage.c.x, G.mage.c.y - 360, { size:56, fill:0xbfe8ff, life:0.8 });
    sfx('dodge');
    G.dodgeBonus += T.dodgeBonus; G.dodgeCD = 0.4;
  }
  if (G.tutorialActive) hideMoveHint();
}

function hitMage(x){
  const m = G.mage;
  m.flashV = 1; m.hurtT = 0.3;
  m.knock = (m.c.x >= x ? 1 : -1)*1100;
  G.stun = T.stunTime;
  G.shake = Math.max(G.shake, 12);
  pop('Ouch!', m.c.x, m.c.y - 360, { size:60, fill:0xff9a9a, life:0.8 });
  sfx('ouch');
}

  // Replay: text + a hand-drawn-style circular arrow, sitting just under Play now
  const replay = new PIXI.Container(); replay.position.set(540, 1395);
  const rTxt = txt('Replay', 54, 0xfff8e6, 0x141414, 8);
  const icon = new PIXI.Container();
  const R = 21, a0 = -Math.PI*0.3, a1 = a0 + Math.PI*1.55;          // ~280 degree arc, clockwise
  const ex = Math.cos(a1)*R, ey = Math.sin(a1)*R;                    // arc end
  const tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);   // tangent + normal
  const head = [ex + tx*16, ey + ty*16, ex + nx*13, ey + ny*13, ex - nx*13, ey - ny*13];
  // black silhouette (arc + head) first, cream shape on top: one continuous outline, like the text stroke
  const arc = (w, col) => new PIXI.Graphics().moveTo(Math.cos(a0)*R, Math.sin(a0)*R).arc(0, 0, R, a0, a1).stroke({ width:w, color:col, cap:'round' });
  icon.addChild(
    arc(16, 0x141414),
    new PIXI.Graphics().poly(head).fill(0x141414).stroke({ width:9, color:0x141414, join:'round' }),
    arc(7, 0xfff8e6),
    new PIXI.Graphics().poly(head).fill(0xfff8e6)
  );
  const iw = 2*R + 16, gap = 16, total = iw + gap + rTxt.width;
  icon.x = -total/2 + iw/2; rTxt.x = -total/2 + iw + gap + rTxt.width/2;
  replay.addChild(icon, rTxt);
  replay.eventMode = 'static'; replay.cursor = 'pointer';
  replay.hitArea = new PIXI.Rectangle(-total/2 - 20, -45, total + 40, 90);
  replay.on('pointerdown', ev => { ev.stopPropagation(); sfx('click'); setTimeout(startGame, 0); });
  e.addChild(dim, title, sub, cta, note, replay);
  G.ui.addChild(e);
  G.end = { c:e, cta, t:0 };
}

function drawFrost(p){
  if (Math.abs(p - G.frostP) < 0.005) return;
  G.frostP = p;
  const e = G.frostEdge; e.clear();
  if (p > 0){
    const th = 24;
    for (let b = 0; b < 8; b++){
      const a = p*0.3*(1 - b/8);
      const top = VIS.y0, hh = H - top;
      e.rect(0, top + b*th, W, th).fill({ color:0xdff4ff, alpha:a });
      e.rect(0, H - (b+1)*th, W, th).fill({ color:0xdff4ff, alpha:a });
      e.rect(b*th, top, th, hh).fill({ color:0xdff4ff, alpha:a });
      e.rect(W - (b+1)*th, top, th, hh).fill({ color:0xdff4ff, alpha:a });
    }
  }
  const lim = p*G.crackMaxD, wide = G.frostWide, thin = G.frostThin;
  wide.clear(); thin.clear();
  let any = false;
  for (const s of G.cracks){
    if (s.d >= lim) continue;
    any = true;
    wide.moveTo(s.x1, s.y1).lineTo(s.x2, s.y2);
    thin.moveTo(s.x1, s.y1).lineTo(s.x2, s.y2);
  }
  if (any){
    wide.stroke({ width:12, color:0x8fd3ff, alpha:0.85, cap:'round' });
    thin.stroke({ width:4, color:0xffffff, alpha:0.95, cap:'round' });
  }
}

/* ---------------- update ---------------- */
function update(dtReal){
  if (!G) return;
  const dt = dtReal*G.timeScale;
  G.t += dt;
  const t = G.t;

  if (G.phase === 'intro') updateIntro(t);
  if (G.phase === 'fight' || G.phase === 'ready') updateFight(dt, t);
  if (G.phase === 'meteor') updateMeteor(dtReal);
  if (G.phase === 'cliff') updateCliff(dtReal);
  if (G.phase === 'end') updateEnd(dtReal);

  updateMage(dt);
  updateYeti(dt, t);
  updateProjectiles(dt);
  updateParticles(dt);
  updateHUD(dtReal, t);

  G.bgClouds.x = G.bgCloudsX + Math.sin(t*0.25)*20;
  for (const c of G.smallClouds){ c.s.x += c.sp*dtReal; if (c.s.x > W + 20) c.s.x = -c.s.width - 20; }

  // cloud platform: gentle bob + a spring that dips when the yeti lands, hops or gets hit by the meteor
  G.platV += (-60*G.platOff - 9*G.platV)*dtReal;
  G.platOff += G.platV*dtReal;
  G.platShake = Math.max(0, G.platShake - dtReal);
  const bob = Math.sin(t*1.6)*6;
  G.plat.position.set(G.platBase[0] + (G.platShake > 0 ? rand(-4, 4) : 0), G.platBase[1] + G.platOff + bob);
  G.platLift = G.platOff + bob;

  // ambient snow
  for (const f of G.flakes){
    f.g.y += f.vy*dt;
    f.g.x += Math.sin(t*1.3 + f.sway)*25*dt + 20*dt;
    if (f.g.y > H + 10){ f.g.y = VIS.y0 - 10; f.g.x = rand(0, W); }
    if (f.g.x > W + 10) f.g.x = -10;
  }

  // screen shake
  G.shake *= Math.pow(0.015, dtReal);
  if (G.shake < 0.3) G.shake = 0;
  G.root.position.set(rand(-1, 1)*G.shake, rand(-1, 1)*G.shake);
  musicUpdate();

}

function updateIntro(t){
  const y = G.yeti;
  if (t < 0.6) y.c.y = lerp(-600, y.baseY, (t/0.6)*(t/0.6));
  else if (!G.landed){
    G.landed = true; y.c.y = y.baseY; G.shake = 32; G.platV = 520; sfx('land');
    for (let i = 0; i < 26; i++)
      particle(540 + rand(-260, 260), y.baseY - 10, { vx:rand(-300, 300), vy:rand(-500, -150), grav:900, r:rand(8, 18), life:0.8 });
  }
  const bIn = clamp((t - 0.7)/0.3, 0, 1), bOut = clamp((t - 2.0)/0.4, 0, 1);
  G.banner.alpha = G.bannerSub.alpha = bIn*(1 - bOut);
  G.banner.scale.set(lerp(0.5, 1.1, easeOut(bIn)));   // pops in to 110%
  G.hud.alpha = clamp((t - 1.8)/0.6, 0, 1);
  G.btn.alpha = G.hud.alpha;
  if (t >= T.introEnd){ G.phase = 'fight'; G.hud.alpha = 1; G.btn.alpha = 1; }
}

function updateFight(dt, t){
  // movement
  const m = G.mage;
  let dir = 0;
  if (input.keyL) dir = -1;
  else if (input.keyR) dir = 1;
  else if (input.holding){ const d = input.x - m.c.x; if (Math.abs(d) > 14) dir = Math.sign(d); }
  m.c.x = clamp(m.c.x + dir*T.moveSpeed*dt + m.knock*dt, 70, W - 70);
  if (dir){ m.facing = dir; if (G.tutorialActive){ G.tutMoved += T.moveSpeed*dt; if (G.tutMoved > 90) hideMoveHint(); } }
  m.walking = dir !== 0;

  // auto-fire (paused briefly when hit)
  if (G.stun > 0) G.stun -= dt;
  else { G.fireCD -= dt; if (G.fireCD <= 0){ fire(); G.fireCD = T.fireEvery; } }
  G.dodgeCD -= dt;

  // scripted attacks
  while (G.nextAttack < G.attacks.length && t >= G.attacks[G.nextAttack].t){ launchAttack(G.attacks[G.nextAttack]); G.nextAttack++; }
  if (G.nextAttack >= G.attacks.length && t >= G.loopT){ launchAttack({ type:'snow' }); G.loopT = t + 2.4; }

  // meteor charge: guaranteed by meteorFullBy, earlier with good dodging
  G.charge = Math.min(100, chargeFloor(t) + G.dodgeBonus);
  if (G.phase === 'fight' && G.charge >= 100){ G.phase = 'ready'; G.readyAt = t; sfx('ready'); }
  if (G.phase === 'ready'){
    const w = t - G.readyAt;
    G.tapTxt.visible = w > T.readyHintAfter;
    if (w > T.readyTimeout) showEnd('timeout');
  }

}

function updateMeteor(dtReal){
  G.mt += dtReal;
  const mt = G.mt, y = G.yeti;
  G.dark.alpha = lerp(G.dark.alpha, G.impacted ? 0 : 0.5, 0.12);
  if (!G.impacted){
    const u = clamp(mt/1.1, 0, 1), e = u*u;
    const tx = y.c.x, ty = y.c.y - 330;
    G.meteor.position.set(lerp(1150, tx, e), lerp(-200, ty, e));
    G.meteor.rock.rotation += dtReal*2.5;
    for (let i = 0; i < 3; i++)
      particle(G.meteor.x + rand(-50, 50), G.meteor.y + rand(-50, 50), { color:i ? C.fire : C.fireCore, r:rand(14, 30), life:0.3, alpha:0.85 });
    if (u >= 1){
      G.impacted = true;
      G.meteor.destroy(); G.meteor = null;
      G.flash.alpha = 1; G.shake = 44; y.flashV = 1.5; G.platV = 700; sfx('impact');
      G.hp = T.hpAfterMeteor;
      burst(tx, ty, 40, { color:C.fire, min:300, max:1100, life:0.5, rMin:10, rMax:26 });
      burst(tx, ty, 20, { color:0xffffff, min:200, max:700, up:-200, life:0.7, rMin:12, rMax:24, alpha:0.8 });
      digitPop(99999, tx, ty - 120, { gold:true, scale:1.25, life:1.6, vy:-120 });
    }
  } else if (mt > 1.45){
    G.timeScale = 1;
  }
  if (mt > 1.8){ G.phase = 'cliff'; G.ct = 0; G.timeScale = 1; }
}

function updateCliff(dtReal){
  G.ct += dtReal;
  const ct = G.ct, y = G.yeti;
  G.dark.alpha = lerp(G.dark.alpha, 0, 0.1);
  if (ct < 0.9){
    const k = 1 - ct/0.9;
    y.c.rotation = Math.sin(ct*16)*0.14*k;
    y.extraY = Math.sin(Math.min(ct/0.9, 1)*Math.PI)*45;
  } else {
    y.c.rotation = lerp(y.c.rotation, 0, 0.2);
    y.extraY = 0;
    y.roar = easeOut(clamp((ct - 0.9)/0.35, 0, 1));
    if (!G.roared){
      G.roared = true; sfx('roar');
      pop('ROOAAARR!', 540, 300, { size:100, fill:0xbfe8ff, life:1.5, vy:-50, sw:14 });
    }
    if (ct < 2.4) G.shake = Math.max(G.shake, 16);
  }
  drawFrost(clamp((ct - 1.0)/1.2, 0, 1));
  if (ct >= 3.1) showEnd('meteor');
}

function updateEnd(dtReal){
  const e = G.end; e.t += dtReal;
  e.c.alpha = clamp(e.t/0.4, 0, 1);
  e.cta.scale.set(1 + Math.sin(e.t*5)*0.05);
}

function updateMage(dt){
  const m = G.mage;
  m.knock *= Math.pow(0.0005, dt);
  if (Math.abs(m.knock) < 5) m.knock = 0;
  if (G.phase === 'meteor'){             // always face the meteor (or the yeti once it has hit)
    const tx = G.meteor ? G.meteor.x : G.yeti.c.x;
    if (Math.abs(tx - m.c.x) > 4) m.facing = Math.sign(tx - m.c.x);
  }
  m.c.scale.x = -m.facing;               // art faces left, so flip when facing right
  m.castT -= dt;
  m.flashV = Math.max(0, m.flashV - dt*7);   // flash ~0.14s
  m.hurtT = (m.hurtT || 0) - dt;

  // frame priority: hurt > meteor > walking > casting > idle
  let f = 'mage_idle';
  if (m.hurtT > 0) f = 'mage_hurt';         // hurt face stays a bit longer than the flash
  else if (G.phase === 'meteor') f = 'mage_meteor';
  else if (m.walking) f = 'mage_walking';
  else if (m.castT > 0) f = 'mage_casting';
  setMageFrame(f);

  // single walk frame, so the walk is sold with a bounce + waddle in code
  if (m.walking){ m.walkT += dt; m.spr.y = -Math.abs(Math.sin(m.walkT*14))*12; m.spr.rotation = Math.sin(m.walkT*14)*0.05; }
  else { m.walkT = 0; m.spr.y *= 0.7; m.spr.rotation *= 0.7; }
  m.spr.scale.y = m.castT > 0 && !m.walking ? 0.97 : 1;

  m.flash.brightness(1 + m.flashV*1.5, false);
  m.c.alpha = m.flashV > 0 ? (Math.sin(G.t*60) > 0 ? 1 : 0.5) : 1;
}

function updateYeti(dt, t){
  const y = G.yeti;
  y.recoil = Math.max(0, y.recoil - dt*8);
  y.flashV = Math.max(0, y.flashV - dt*5);
  y.c.x = 540 + Math.sin(t*90)*y.flashV*7;   // hit jolt (no colour change)

  let hop = 0;
  if (y.hopT >= 0){ y.hopT += dt; hop = -Math.sin(clamp(y.hopT/0.35, 0, 1)*Math.PI)*40; if (y.hopT > 0.35){ y.hopT = -1; G.platV += 260; } }
  if (G.phase !== 'intro' || G.landed) y.c.y = y.baseY + G.platLift - y.recoil*12 + hop + y.extraY;   // rides the cloud

  // idle breathing: body squashes from the feet, arms ride along
  const breath = Math.sin(t*2.2);
  y.bodyC.scale.set(1 - breath*0.012, 1 + breath*0.025);
  y.armL.y = y.armLBase - breath*7; y.armR.y = y.armRBase - breath*7;
  y.c.scale.set(1 + 0.08*y.roar);
  y.armL.rotation = 0.06*Math.sin(t*2.2 + 1) + 0.5*y.roar;   // arms fling outward on the roar
  let armR = -0.06*Math.sin(t*2.2 + 1) - 0.5*y.roar;
  if (y.throwT >= 0){ y.throwT += dt; armR = -1.3*Math.sin(clamp(y.throwT/0.5, 0, 1)*Math.PI); if (y.throwT > 0.5) y.throwT = -1; }  // raise ~75 degrees
  y.armR.rotation = armR;

  // faces: roar for the finale, gritted teeth when throwing or getting hit
  if (y.roar > 0){
    setFace('faceRoar');
    y.faces.faceRoar.scale.set(1 + 0.25*y.roar + Math.sin(t*40)*0.02*y.roar);
  } else setFace(y.throwT >= 0 || y.flashV > 0.4 ? 'faceGrit' : 'faceIdle');
}

function updateProjectiles(dt){
  for (let i = G.fireballs.length - 1; i >= 0; i--){
    const f = G.fireballs[i];
    f.g.x += f.vx*dt; f.g.y += f.vy*dt;
    f.ft += dt; f.g.texture = TEX[(f.ft % 0.16) < 0.08 ? 'fx_fire1' : 'fx_fire2'].tex;   // flicker
    if (Math.random() < 0.6) particle(f.g.x, f.g.y, { color:C.fire, r:rand(8, 16), life:0.22, alpha:0.7 });
    const passed = (f.tx - f.g.x)*f.vx + (f.ty - f.g.y)*f.vy <= 0;
    if (passed){
      if (G.phase === 'fight' || G.phase === 'ready') fireballHit(f.tx, f.ty);
      f.g.destroy(); G.fireballs.splice(i, 1);
    }
  }
  for (let i = G.shots.length - 1; i >= 0; i--){
    const s = G.shots[i];
    s.t += dt;
    const p = clamp(s.t/s.tele, 0, 1);
    s.sh.scale.set(0.2 + 0.8*p); s.sh.alpha = 0.4 + 0.6*p;
    const launchAt = s.tele - s.fall;
    if (!s.proj && s.t >= launchAt){
      if (s.type === 'snow'){
        s.proj = new PIXI.Sprite(TEX.fx_snowball.tex); s.proj.anchor.set(0.5);
        const pw = yetiPaw(); s.sx = pw.x; s.sy = pw.y;
        G.yeti.throwT = 0; sfx('throw');
      } else {
        s.proj = new PIXI.Sprite(TEX['fx_ice' + (1 + Math.floor(Math.random()*4))].tex); s.proj.anchor.set(0.5);   // random icicle
        s.sx = s.x; s.sy = 1020 + G.platLift;   // drops out of the cloud's underside
        G.platShake = 0.3;
        if (G.yeti.hopT < 0) G.yeti.hopT = 0;
      }
      (s.type === 'ice' ? G.L.under : G.L.shots).addChild(s.proj);
    }
    if (s.proj){
      const u = clamp((s.t - launchAt)/s.fall, 0, 1);
      if (s.type === 'snow'){
        s.proj.position.set(lerp(s.sx, s.x, u), lerp(s.sy, GROUND_Y - 40, u) - Math.sin(Math.PI*u)*260);
        s.proj.rotation += dt*8;
      } else {
        s.proj.position.set(s.x, lerp(s.sy, GROUND_Y - 60, u*u));
      }
    }
    if (s.t >= s.tele){
      landShot(s);
      s.sh.destroy(); if (s.proj) s.proj.destroy();
      G.shots.splice(i, 1);
    }
  }
}

function updateParticles(dt){
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    if (p.life <= 0){ p.g.destroy(); G.particles.splice(i, 1); continue; }
    p.vy += p.grav*dt;
    p.g.x += p.vx*dt; p.g.y += p.vy*dt;
    const k = p.life/p.max;
    p.g.alpha = k;
    if (p.shrink) p.g.scale.set(0.3 + 0.7*k);
  }
  for (let i = G.pops.length - 1; i >= 0; i--){
    const q = G.pops[i];
    q.life -= dt;
    if (q.life <= 0){ q.t.destroy({ children:true }); G.pops.splice(i, 1); continue; }
    const age = q.max - q.life;
    const s = age < 0.12 ? lerp(0.4, 1.25, age/0.12) : lerp(1.25, 1, clamp((age - 0.12)/0.1, 0, 1));
    q.t.scale.set(q.base*s);
    q.t.y += q.vy*dt; q.vy *= Math.pow(0.05, dt);
    q.t.alpha = q.life < 0.3 ? q.life/0.3 : 1;
  }
}

function updateHUD(dtReal, t){
  G.hpGhost = G.hpGhost > G.hp ? Math.max(G.hp, G.hpGhost - dtReal*0.25) : G.hp;
  const g = G.hpG; g.clear();
  const x = 96, y = 144, w = 888, h = 38;
  if (G.hpGhost > 0) g.roundRect(x, y, w*G.hpGhost, h, 19).fill({ color:0xffffff, alpha:0.7 });
  if (G.hp > 0) g.roundRect(x, y, Math.max(h, w*G.hp), h, 19).fill(0xff4a5a);
  G.hpTxt.text = Math.round(G.hp*100) + '%';

  // meteor button
  const r = G.ring; r.clear();
  const frac = G.charge/100;
  const ready = G.phase === 'ready';
  if (frac > 0){
    const a0 = -Math.PI/2;
    r.moveTo(Math.cos(a0)*100, Math.sin(a0)*100).arc(0, 0, 100, a0, a0 + Math.PI*2*frac)
     .stroke({ width:14, color:ready ? 0xffd23f : C.fire, cap:'round' });
  }
  G.btnIcon.alpha = ready ? 1 : 0.6;
  // fire grows as the meteor charges and roars when it's ready
  for (const f of G.btnFlames){
    f.texture = TEX[((t + f.ph) % 0.16) < 0.08 ? 'fx_fire1' : 'fx_fire2'].tex;
    const k = ready ? 1 + Math.sin(t*14 + f.ph*40)*0.08 : 0.25 + 0.6*frac;
    f.scale.set(f.base*k);
  }
  G.btnRockGlow.alpha = ready ? 0.7 + Math.sin(t*8)*0.3 : 0.3*frac;
  G.btnRock.rotation += ready ? dtReal*1.5 : 0;
  G.btnGlow.alpha = ready ? 0.6 + Math.sin(t*8)*0.4 : 0;
  G.btn.scale.set(ready ? 1 + Math.sin(t*8)*0.08 : 1);
  G.tapTxt.position.set(880, 1650 + Math.sin(t*8)*10);

  G.flash.alpha = Math.max(0, G.flash.alpha - dtReal*2.5);
}
